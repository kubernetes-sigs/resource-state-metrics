kind: Bar
metadata:
  name: test-sample-secondary
  namespace: default
  labels:
    foo: "0"
    bar: "0"
spec:
  appId: test-sample-secondary
  language: csharp
  os: linux
  instanceSize: small
  environmentType: dev
