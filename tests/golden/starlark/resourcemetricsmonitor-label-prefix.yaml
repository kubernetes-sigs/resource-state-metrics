name: resourcemetricsmonitor-starlark-label-prefix
description: >
  Tests the Starlark label_prefix helper, which prefixes every key of a dict
  and sanitizes the result. This pins the Starlark side of the shared
  sanitizer, the same way the CEL label-prefix fixture pins the CEL side.
in:
  apiVersion: resource-state-metrics.instrumentation.k8s-sigs.io/v1alpha1
  kind: ResourceMetricsMonitor
  metadata:
    name: resourcemetricsmonitor-starlark-label-prefix
    namespace: default
  spec:
    configuration:
      stores:
        - group: "samplecontroller.k8s.io"
          version: "v1beta1"
          kind: "Bar"
          resource: "bars"
          families:
            - name: "starlark_label_prefix"
              help: "Labels of each Bar through label_prefix"
              resolver: starlark
              starlark:
                script: |
                  labels = label_prefix(obj["metadata"]["labels"], "label_")
                  families = [
                      family(
                          name="starlark_label_prefix",
                          help="Labels of each Bar through label_prefix",
                          kind="gauge",
                          samples=[metric(labels=labels, value=1.0)]
                      )
                  ]
metrics:
  - "# HELP kube_customresource_starlark_label_prefix Labels of each Bar through label_prefix"
  - "# TYPE kube_customresource_starlark_label_prefix gauge"
  - 'kube_customresource_starlark_label_prefix{label_bar="2",label_foo="1",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
  - 'kube_customresource_starlark_label_prefix{label_bar="0",label_foo="0",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample-secondary",namespace="default"} 1.000000'
status:
  cardinality:
    total: 2
    thresholdsExceeded: false
  conditions:
    - type: Processed
      status: "True"
      reason: EventHandlerSucceeded
    - type: CardinalityCutoff
      status: "False"
      reason: CardinalityOK
    - type: CardinalityWarning
      status: "False"
      reason: CardinalityOK
