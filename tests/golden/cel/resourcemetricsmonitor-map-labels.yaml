name: resourcemetricsmonitor-bars-map-labels
description: >
  Tests map expansion of a plain map, one with no list inside it. Through
  the "_" label each entry of metadata.labels becomes a label of its own,
  and through a named label each entry is prefixed with the label name.
  Each Bar gives one sample per family.
in:
  apiVersion: resource-state-metrics.instrumentation.k8s-sigs.io/v1alpha1
  kind: ResourceMetricsMonitor
  metadata:
    name: resourcemetricsmonitor-bars-map-labels
    namespace: default
  spec:
    configuration:
      stores:
        - group: "samplecontroller.k8s.io"
          version: "v1beta1"
          kind: "Bar"
          resource: "bars"
          families:
            - name: "bars_labels"
              help: "Labels of each Bar"
              metrics:
                - resolver: "cel"
                  labels:
                    - name: "_"
                      value: "o.metadata.labels"
                  value: "1"
            - name: "bars_labels_prefixed"
              help: "Labels of each Bar prefixed with the label name"
              metrics:
                - resolver: "cel"
                  labels:
                    - name: "meta"
                      value: "o.metadata.labels"
                  value: "1"
metrics:
  - "# HELP kube_customresource_bars_labels Labels of each Bar"
  - "# TYPE kube_customresource_bars_labels gauge"
  - 'kube_customresource_bars_labels{bar="2",foo="1",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
  - 'kube_customresource_bars_labels{bar="0",foo="0",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample-secondary",namespace="default"} 1.000000'
  - "# HELP kube_customresource_bars_labels_prefixed Labels of each Bar prefixed with the label name"
  - "# TYPE kube_customresource_bars_labels_prefixed gauge"
  - 'kube_customresource_bars_labels_prefixed{metabar="2",metafoo="1",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
  - 'kube_customresource_bars_labels_prefixed{metabar="0",metafoo="0",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample-secondary",namespace="default"} 1.000000'
status:
  cardinality:
    total: 4
    thresholdsExceeded: false
  conditions:
    - type: Processed
      status: "True"
      reason: EventHandlerSucceeded
    - type: CardinalityCutoff
      status: "False"
      reason: CardinalityOK
    - type: CardinalityWarning
      status: "False"
      reason: CardinalityOK
