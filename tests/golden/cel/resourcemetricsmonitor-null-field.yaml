name: resourcemetricsmonitor-bars-null-field
description: >
  Tests that a label resolving to a null field is written with the literal
  value "<nil>". Both Bars set spec.owner to null, which the CRD allows
  through nullable: true.
in:
  apiVersion: resource-state-metrics.instrumentation.k8s-sigs.io/v1alpha1
  kind: ResourceMetricsMonitor
  metadata:
    name: resourcemetricsmonitor-bars-null-field
    namespace: default
  spec:
    configuration:
      stores:
        - group: "samplecontroller.k8s.io"
          version: "v1beta1"
          kind: "Bar"
          resource: "bars"
          families:
            - name: "bars_owner"
              help: "Owner of each Bar"
              metrics:
                - resolver: "cel"
                  labels:
                    - name: "owner"
                      value: "o.spec.owner"
                  value: "1"
metrics:
  - "# HELP kube_customresource_bars_owner Owner of each Bar"
  - "# TYPE kube_customresource_bars_owner gauge"
  - 'kube_customresource_bars_owner{owner="<nil>",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
  - 'kube_customresource_bars_owner{owner="<nil>",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample-secondary",namespace="default"} 1.000000'
status:
  cardinality:
    total: 2
    thresholdsExceeded: false
  conditions:
    - type: Processed
      status: "True"
      reason: EventHandlerSucceeded
    - type: CardinalityCutoff
      status: "False"
      reason: CardinalityOK
    - type: CardinalityWarning
      status: "False"
      reason: CardinalityOK
