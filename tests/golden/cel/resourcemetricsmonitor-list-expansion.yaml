name: resourcemetricsmonitor-bars-list-expansion
description: >
  Tests that a label resolving to a list expands into one sample per item,
  sorted by the label value, and that an empty list produces no sample for
  that object. test-sample has three tags and test-sample-secondary has an
  empty tags list.
in:
  apiVersion: resource-state-metrics.instrumentation.k8s-sigs.io/v1alpha1
  kind: ResourceMetricsMonitor
  metadata:
    name: resourcemetricsmonitor-bars-list-expansion
    namespace: default
  spec:
    configuration:
      stores:
        - group: "samplecontroller.k8s.io"
          version: "v1beta1"
          kind: "Bar"
          resource: "bars"
          families:
            - name: "bars_tags"
              help: "One sample per tag of each Bar"
              metrics:
                - resolver: "cel"
                  labels:
                    - name: "tag"
                      value: "o.spec.tags"
                  value: "1"
metrics:
  - "# HELP kube_customresource_bars_tags One sample per tag of each Bar"
  - "# TYPE kube_customresource_bars_tags gauge"
  - 'kube_customresource_bars_tags{tag="backend",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
  - 'kube_customresource_bars_tags{tag="frontend",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
  - 'kube_customresource_bars_tags{tag="middleware",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
status:
  cardinality:
    total: 3
    thresholdsExceeded: false
  conditions:
    - type: Processed
      status: "True"
      reason: EventHandlerSucceeded
    - type: CardinalityCutoff
      status: "False"
      reason: CardinalityOK
    - type: CardinalityWarning
      status: "False"
      reason: CardinalityOK
