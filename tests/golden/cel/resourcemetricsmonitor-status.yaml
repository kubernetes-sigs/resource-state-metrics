name: resourcemetricsmonitor-bars-status
description: >
  Tests that whole numbers inside a resolved map become labels. apimachinery
  decodes them as int64, which the CEL map path used to drop. The
  activeZones list drives one sample per zone, with the zone under the "_"
  label.
in:
  apiVersion: resource-state-metrics.instrumentation.k8s-sigs.io/v1alpha1
  kind: ResourceMetricsMonitor
  metadata:
    name: resourcemetricsmonitor-bars-status
    namespace: default
  spec:
    configuration:
      stores:
        - group: "samplecontroller.k8s.io"
          version: "v1beta1"
          kind: "Bar"
          resource: "bars"
          families:
            - name: "bars_status_replicas"
              help: "Replica counts from the status of each Bar instance"
              metrics:
                - resolver: "cel"
                  labels:
                    - name: "_"
                      value: "o.status"
                  value: "o.status.replicas"
metrics:
  - '# HELP kube_customresource_bars_status_replicas Replica counts from the status of each Bar instance'
  - '# TYPE kube_customresource_bars_status_replicas gauge'
  - 'kube_customresource_bars_status_replicas{available_replicas="3",ready_replicas="3",replicas="4",updated_replicas="4",_="us-east-1a",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 4.000000'
  - 'kube_customresource_bars_status_replicas{available_replicas="3",ready_replicas="3",replicas="4",updated_replicas="4",_="us-east-1b",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 4.000000'
  - 'kube_customresource_bars_status_replicas{available_replicas="0",ready_replicas="0",replicas="1",updated_replicas="1",_="us-east-1a",group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample-secondary",namespace="default"} 1.000000'
status:
  cardinality:
    total: 3
    thresholdsExceeded: false
  conditions:
    - type: Processed
      status: "True"
      reason: EventHandlerSucceeded
    - type: CardinalityCutoff
      status: "False"
      reason: CardinalityOK
    - type: CardinalityWarning
      status: "False"
      reason: CardinalityOK
