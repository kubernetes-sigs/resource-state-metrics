name: resourcemetricsmonitor-cardinality-store-cutoff-initial
description: >
  Test the soft-cutoff behavior at the store level. The Bar store's
  cardinalityLimit is 1; after both Bar objects are processed the total (2)
  exceeds the limit.

  Cutoff is soft: metrics are generated for an object first, then the threshold
  is evaluated. The object that tips the total over the limit still emits
  metrics on that initial pass. This case asserts those metrics — both Bar
  samples are visible immediately after the initial pass, before any subsequent
  reprocessing would suppress them.
in:
  apiVersion: resource-state-metrics.instrumentation.k8s-sigs.io/v1alpha1
  kind: ResourceMetricsMonitor
  metadata:
    name: resourcemetricsmonitor-cardinality-store-cutoff-initial
    namespace: default
  spec:
    configuration:
      stores:
        - group: "samplecontroller.k8s.io"
          version: "v1beta1"
          kind: "Bar"
          resource: "bars"
          resolver: unstructured
          cardinalityLimit: 1
          families:
            - name: "cardinality_store_cutoff_initial_test"
              help: "Store cutoff initial test - store limit 1"
              metrics:
                - labels: []
                  value: "1"
metrics:
  - '# HELP kube_customresource_cardinality_store_cutoff_initial_test Store cutoff initial test - store limit 1'
  - '# TYPE kube_customresource_cardinality_store_cutoff_initial_test gauge'
  - 'kube_customresource_cardinality_store_cutoff_initial_test{group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample",namespace="default"} 1.000000'
  - 'kube_customresource_cardinality_store_cutoff_initial_test{group="samplecontroller.k8s.io",version="v1beta1",kind="Bar",name="test-sample-secondary",namespace="default"} 1.000000'
status:
  cardinality:
    total: 2
    thresholdsExceeded: true
  conditions:
    - type: Processed
      status: "True"
      reason: EventHandlerSucceeded
    - type: CardinalityCutoff
      status: "True"
      reason: CardinalityCutoff
    - type: CardinalityWarning
      status: "True"
      reason: CardinalityWarning
---
name: resourcemetricsmonitor-cardinality-store-cutoff
description: >
  Test store-level cardinality cutoff. The Bar store has a cardinalityLimit of
  1, so once both Bar objects are processed the store total (2) exceeds the
  limit and every family in that store is cut off — on subsequent reprocessing
  no metrics are emitted from it.

  A second, unconstrained Foo store is present to give the metrics assertion
  something stable to check. The Bar store cutoff itself is verified via the
  status conditions and cardinality totals.

  Note: cutoff is soft — metrics are generated for an object first, then the
  threshold is checked. The object that tips the store over its limit still
  emits metrics on that initial pass; only subsequent reprocessing (e.g. after
  an informer relist) suppresses output.
in:
  apiVersion: resource-state-metrics.instrumentation.k8s-sigs.io/v1alpha1
  kind: ResourceMetricsMonitor
  metadata:
    name: resourcemetricsmonitor-cardinality-store-cutoff
    namespace: default
  spec:
    configuration:
      stores:
        - group: "samplecontroller.k8s.io"
          version: "v1beta1"
          kind: "Bar"
          resource: "bars"
          resolver: unstructured
          cardinalityLimit: 1
          families:
            - name: "cardinality_store_cutoff_test"
              help: "Store cutoff test - store limit 1"
              metrics:
                - labels: []
                  value: "1"
        - group: "samplecontroller.k8s.io"
          version: "v1alpha1"
          kind: "Foo"
          resource: "foos"
          resolver: unstructured
          families:
            - name: "cardinality_store_cutoff_unconstrained"
              help: "Unconstrained Foo store; always emits metrics"
              metrics:
                - labels: []
                  value: "spec.replicas"
metrics:
  - '# HELP kube_customresource_cardinality_store_cutoff_unconstrained Unconstrained Foo store; always emits metrics'
  - '# TYPE kube_customresource_cardinality_store_cutoff_unconstrained gauge'
  - 'kube_customresource_cardinality_store_cutoff_unconstrained{group="samplecontroller.k8s.io",version="v1alpha1",kind="Foo",name="test-sample",namespace="default"} 1.000000'
status:
  cardinality:
    total: 3
    thresholdsExceeded: true
  conditions:
    - type: Processed
      status: "True"
      reason: EventHandlerSucceeded
    - type: CardinalityCutoff
      status: "True"
      reason: CardinalityCutoff
    - type: CardinalityWarning
      status: "True"
      reason: CardinalityWarning
