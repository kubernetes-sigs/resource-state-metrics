---
# See https://cloud.google.com/cloud-build/docs/build-config
timeout: 2700s
# ALLOW_LOOSE lets Cloud Build define substitution variables (e.g., _GIT_TAG)
# without failing when this config doesn't reference all of them.
options:
  substitution_option: ALLOW_LOOSE
steps:
  # goreleaser (with ko) builds and pushes the images, which needs a Go toolchain but no Docker daemon.
  - name: 'golang:1.26'
    entrypoint: bash
    env:
      - TAG=$_PULL_BASE_REF
    args:
      - -c
      - |
        git config --global --add safe.directory "$$(pwd)"
        make image-push
serviceAccount: projects/k8s-staging-images/serviceAccounts/resource-state-metrics-sa@k8s-staging-images.iam.gserviceaccount.com
