name: validations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GO_VERSION: 1.25

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet the codebase
        run: go vet ./...
  verify-codegen:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup dependencies
        run: make setup
      - name: Verify pkg/generated
        run: make verify_codegen
  lint:
    needs: verify-codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup dependencies
        run: make setup
      - name: Run linter
        run: make lint
      - name: Lint commit (gitlint)
        run: pre-commit run gitlint-ci --hook-stage manual
      - name: Lint commit (conventional)
        run: |
          git log -1 --pretty=%B > /tmp/commit-msg
          pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg
  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup dependencies
        run: make setup
      - name: Run unit tests
        run: make test_unit
  test-e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup dependencies
        run: make setup
      - name: Run e2e tests
        run: make test_e2e
  compare-metrics:
    needs: [test-unit, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup dependencies
        run: make setup
      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
      - name: Start controller
        run: make local &
      - name: Wait for the controller to run and manifests to be applied so they don't race with testdata
        run: sleep 8
      - name: Apply testdata
        run: make apply_testdata
      - name: Wait for metrics
        run: sleep 2
      - name: Compare metrics
        run: make compare_metrics

