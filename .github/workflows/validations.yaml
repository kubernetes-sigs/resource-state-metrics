name: validations
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Vet the codebase
        run: go vet ./...
  verify_generated:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Verify generated assets
        run: make verify_generated
  lint:
    needs: verify_generated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Run linter
        run: make lint
      - name: Lint commit (gitlint)
        if: github.event_name == 'pull_request'
        run: |
          pre-commit run gitlint-ci --hook-stage manual --from-ref origin/${{ github.base_ref }} --to-ref HEAD
      - name: Lint commit (conventional)
        if: github.event_name == 'pull_request'
        run: |
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          COMMITS=$(git rev-list --no-merges $MERGE_BASE..HEAD)
          for commit in $COMMITS; do
            echo "Checking commit: $commit"
            git log -1 --pretty=%B $commit > /tmp/commit-msg
            pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg
          done
  tests:
    needs: lint
    uses: ./.github/workflows/tests.yaml
