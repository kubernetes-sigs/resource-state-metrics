# Reusable workflow for running tests. Called by validations.yaml (once) and
# flake-detection.yaml (multiple times via the iterations input).
#
# Why matrix over a loop: each iteration appears as a separate check in the
# GitHub UI, making it easy to see how many iterations failed and inspect logs
# per iteration, rather than digging through a single job's output.
#
# Caching: actions/setup-go caches the Go module download cache by default, so
# the repeated `make setup` (go install) calls across matrix iterations hit
# warm cache after the first run.
name: tests
on:
  workflow_call:
    inputs:
      iterations:
        description: Number of times to run each test job
        type: number
        default: 1
      ref:
        description: Git ref to checkout (empty uses the default)
        type: string
        default: ''
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          echo "matrix=$(python3 -c "import json; print(json.dumps({'iteration': list(range(1, ${{ inputs.iterations }} + 1))}))")" >> "$GITHUB_OUTPUT"
  test-unit:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Setup dependencies
        run: make setup
      - name: Run unit tests (iteration ${{ matrix.iteration }})
        run: make test_unit
  test-e2e:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Setup dependencies
        run: make setup
      - name: Run e2e tests (iteration ${{ matrix.iteration }})
        run: make test_e2e
  compare-metrics:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Setup dependencies
        run: make setup
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind
      - name: Start controller
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          kind export kubeconfig
          nohup bash -c 'V=10 CREATED_AT_EPOCH=0 make local' &>/tmp/controller.log &
      - name: Wait for the build to complete
        run: sleep 60
      - name: Apply testdata
        run: make apply_testdata
      - name: Wait for metrics
        run: sleep 10
      - name: Compare metrics (iteration ${{ matrix.iteration }})
        run: make compare_metrics
      - name: Print controller logs
        if: always()
        run: cat /tmp/controller.log || echo "(no controller logs found)"
